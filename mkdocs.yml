#基础设置
site_name: 星弦·北门观测站 #站点名
site_url: https://kitty-in-github.github.io/starlight_recording/ #默认站点地址


#markdown扩展语法
markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition #MkDocs 警告框
  - footnotes #脚注
  - meta #自定义文章元数据
  - pymdownx.caret #下划线
  - pymdownx.mark #文本高亮
  - pymdownx.tilde #删除线
  - toc: # 大纲
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify

#站点设置
theme:
  features:
    - content.code.copy #启用代码块复制按钮
    - navigation.tabs #启用导航选项卡
    - navigation.indexes #分组标题可打开栏目首页
    - navigation.instant
    - navigation.instant.progress #启用缓冲条
    - navigation.prune #启用导航修剪
    - toc.follow #启用导航跟随
    - navigation.top #返回顶部按钮
    
  palette:
    # 日间模式
    - scheme: default
      primary: black
      toggle:
        icon: material/eye #按键图标
        name: 潜入黑暗 #图表提示词

    # 夜间模式
    - scheme: slate
      primary: white
      toggle:
        icon: material/eye-outline
        name: 迎接光明

  name: material #主题名称
  language: zh
  logo: img/favicon.png #网页种左上角的图表
  favicon: img/favicon.png #标签页上的图标

